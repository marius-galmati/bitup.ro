# Serviciul `bitup-web` (docker-compose.yml): servește dist/ și trimite /api/ la `bitup-api`.
# ARHITECTURA § Deploy, § Headere de securitate, § Redirecturi, § Rute (trailingSlash: 'never', build.format: 'file').
# În față: Cloudflare (proxy) → Traefik din Dokploy (TLS) → nginx pe portul 80, în rețeaua Docker.

# Jurnalul de acces fără adresa IP și fără antete: pagina, codul, mărimea, durata (vezi pagina de confidențialitate).
log_format bitup '$time_iso8601 $host "$request_method $request_uri" $status $body_bytes_sent $request_time';

map $host $robots_tag {
    bitup.ro "";
    default  "noindex, nofollow";
}

# Redirecturile 301 din ARHITECTURA § Redirecturi. Ancora stă separat, ca parametrii (?utm_…) să ajungă înaintea ei.
map $uri $legacy_path {
    default                              "";
    /de-ce-bitup                         /cum-lucram;
    /industrii                           /servicii;
    /servicii/cybersecurity              /servicii/securitate;
    /servicii/backup-disaster-recovery   /servicii/securitate;
    /servicii/mentenanta-suport          /servicii/suport-it;
    /servicii/infrastructura-it          /servicii/suport-it;
    /servicii/hosting-cloud              /servicii/suport-it;
    /servicii/solutii-hardware           /servicii/suport-it;
    /servicii/automatizari-ai            /servicii/automatizari;
    /servicii/software-development       /servicii/automatizari;
    /termeni-si-conditii                 /termeni;
    /politica-de-confidentialitate       /confidentialitate;
}
map $uri $legacy_hash {
    default                              "";
    /servicii/backup-disaster-recovery   "#backup";
    /servicii/hosting-cloud              "#cloud";
    /servicii/solutii-hardware           "#echipamente";
    /servicii/software-development       "#software";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;   # Location relativ: în spatele proxy-ului nginx nu știe că pagina e pe https
    access_log /dev/stdout bitup;
    error_log /dev/stderr warn;
    log_not_found off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml application/rss+xml;

    # www → apex (ARHITECTURA § Redirecturi, ultima regulă).
    if ($host = www.bitup.ro) {
        return 301 https://bitup.ro$request_uri;
    }
    if ($legacy_path) {
        return 301 $legacy_path$is_args$args$legacy_hash;
    }
    # /despre/ → /despre, /en/ → /en (trailingSlash: 'never'); rewrite-ul păstrează parametrii.
    rewrite ^/(.+)/$ /$1 permanent;

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Paginile au o singură adresă, fără `.html` (cum făcea Cloudflare Pages).
    location = /index.html {
        return 301 /;
    }
    location ~ ^(?<page>/.+)\.html$ {
        return 301 $page$is_args$args;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files /index.html =404;
    }

    # Fișierele din /_astro/ au hash în nume: se pot ține un an.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        client_max_body_size 64k;
        # Rezolvat la fiecare cerere prin DNS-ul Docker: dacă `bitup-api` repornește cu alt IP, nginx îl găsește.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://bitup-api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # /despre → despre.html, /en → en.html, /blog → blog.html (build.format: 'file').
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri.html =404;
    }
}
